<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ban appeal · Sentinel AC</title>
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body>
  <div class="auth-page"><div class="auth-card" style="width:520px">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg><span>Sentinel <em>AC</em></span></div>
    <h2>Ban appeal</h2><p class="lead">Enter the ban ID from your disconnect message and explain why the ban should be reviewed.</p>
    <form id="f">
      <label class="field">Ban ID<input class="input mono" name="banId" placeholder="SB-XXXXXXXX" maxlength="11" required /></label>
      <label class="field">Your message<textarea class="input" name="message" minlength="20" maxlength="3000" required placeholder="At least 20 characters"></textarea></label>
      <label class="field">Contact (Discord username or email, optional)<input class="input" name="contact" maxlength="200" /></label>
      <div class="err" id="err"></div>
      <button class="btn primary" style="height:40px" type="submit">Submit appeal</button>
    </form>
    <div id="done" class="notice hidden" style="margin-top:6px"></div>
  </div></div>
  <script src="/assets/js/appeal.js"></script>
</body>
</html>
