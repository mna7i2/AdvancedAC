<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sentinel AC</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Toasts / alerts / announcements are visible even when the menu is closed -->
  <div id="toasts"></div>
  <div id="announce" class="hidden"><div class="announce-card"><div class="announce-title"></div><div class="announce-text"></div></div></div>
  <div id="spectate-bar" class="hidden"><span class="dot"></span>Spectating <b id="spec-name"></b> <span class="muted">— press BACKSPACE to stop</span></div>

  <div id="app" class="hidden">
    <aside class="sidebar">
      <div class="brand"><svg viewBox="0 0 24 24" class="logo"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Sentinel <em>AC</em></span></div>
      <nav>
        <button class="nav active" data-view="players"><i class="ic">👥</i>Players</button>
        <button class="nav" data-view="alerts"><i class="ic">⚠</i>Alerts <span id="alert-count" class="pill hidden"></span></button>
        <button class="nav" data-view="tools"><i class="ic">🛠</i>Server Tools</button>
        <button class="nav" data-view="status"><i class="ic">🛡</i>Protection</button>
      </nav>
      <div class="side-foot"><div id="conn" class="conn"></div><div class="muted small" id="me"></div></div>
    </aside>

    <main>
      <header>
        <h1 id="view-title">Players</h1>
        <div class="head-right">
          <input id="search" placeholder="Search name or ID…" autocomplete="off" />
          <button class="icon-btn" id="refresh" title="Refresh">⟳</button>
          <button class="icon-btn" id="close" title="Close (ESC)">✕</button>
        </div>
      </header>

      <!-- Players -->
      <section id="view-players" class="view">
        <div class="split">
          <div class="list" id="player-list"></div>
          <div class="detail" id="player-detail"><div class="empty">Select a player</div></div>
        </div>
      </section>

      <!-- Alerts -->
      <section id="view-alerts" class="view hidden"><div id="alert-list" class="alerts"></div></section>

      <!-- Tools -->
      <section id="view-tools" class="view hidden">
        <div class="grid2">
          <div class="card">
            <h3>Announcement</h3>
            <input id="ann-title" placeholder="Title" maxlength="80" />
            <textarea id="ann-text" placeholder="Message" maxlength="500"></textarea>
            <button class="btn primary" data-perm="announce.send" id="ann-send">Send to everyone</button>
          </div>
          <div class="card">
            <h3>Entity cleanup</h3>
            <p class="muted small">Removes networked entities server-wide. Vehicles with a player driver are kept.</p>
            <div class="btn-col">
              <button class="btn" data-perm="entities.cleanup" data-act="delete_vehicles">🚗 Delete vehicles</button>
              <button class="btn" data-perm="entities.cleanup" data-act="delete_peds">🚶 Delete peds</button>
              <button class="btn" data-perm="entities.cleanup" data-act="delete_objects">📦 Delete objects</button>
            </div>
          </div>
          <div class="card">
            <h3>Unban</h3>
            <input id="unban-id" placeholder="Ban ID (SB-XXXXXXXX)" maxlength="16" />
            <input id="unban-reason" placeholder="Reason" maxlength="300" />
            <button class="btn" data-perm="players.unban" id="unban-send">Revoke ban</button>
          </div>
        </div>
      </section>

      <!-- Status -->
      <section id="view-status" class="view hidden"><div id="status-grid" class="stat-grid"></div></section>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div class="modal-actions"><button class="btn" id="modal-cancel">Cancel</button><button class="btn danger" id="modal-ok">Confirm</button></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
